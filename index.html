<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>色彩図鑑 — Color Atlas</title>
<style>
  :root{
    --ink:#141210;
    --paper:#fbf9f5;
    --radius:18px;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;width:100%;overflow:hidden;}
  body{
    background:#6495ed;
    color:#fff;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,-apple-system,sans-serif;
    transition:background-color .18s linear;
    -webkit-font-smoothing:antialiased;
  }
  .serif{
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",Georgia,serif;
  }

  /* ---------- 上部：検索バー ---------- */
  .top{
    position:fixed;top:0;left:0;right:0;z-index:60;
    display:flex;flex-direction:column;align-items:center;
    padding:18px 16px 0;
    pointer-events:none;
  }
  .search-wrap{
    position:relative;width:min(560px,100%);pointer-events:auto;
  }
  .search-bar{
    display:flex;align-items:center;gap:10px;
    width:100%;
    padding:0 16px;height:52px;
    border-radius:999px;
    border:1px solid var(--line,rgba(255,255,255,.22));
    background:var(--surface,rgba(18,16,14,.55));
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 10px 30px var(--shadow,rgba(0,0,0,.28));
    transition:box-shadow .25s var(--ease),background .25s;
  }
  .search-bar:focus-within{
    box-shadow:0 14px 44px var(--shadow,rgba(0,0,0,.4));
  }
  .search-bar svg{flex:none;opacity:.62;}
  #q{
    flex:1;min-width:0;height:100%;
    border:none;outline:none;background:transparent;
    color:var(--fg,#fff);
    font-size:15px;letter-spacing:.02em;
  }
  #q::placeholder{color:var(--fg-dim,rgba(255,255,255,.5));}
  .hint-key{
    flex:none;font-size:10px;letter-spacing:.12em;
    padding:3px 7px;border-radius:6px;
    border:1px solid var(--line,rgba(255,255,255,.22));
    color:var(--fg-dim,rgba(255,255,255,.55));
  }

  /* サジェスト */
  .suggest{
    position:absolute;top:calc(100% + 8px);left:0;right:0;
    max-height:min(46vh,380px);overflow-y:auto;overscroll-behavior:contain;
    border-radius:var(--radius);
    border:1px solid var(--line,rgba(255,255,255,.18));
    background:var(--surface-strong,rgba(18,16,14,.82));
    backdrop-filter:blur(22px) saturate(150%);
    -webkit-backdrop-filter:blur(22px) saturate(150%);
    box-shadow:0 20px 50px var(--shadow,rgba(0,0,0,.4));
    padding:6px;
    display:none;
  }
  .suggest.open{display:block;animation:pop .16s var(--ease);}
  @keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.99);}to{opacity:1;transform:none;}}
  .sug{
    display:flex;align-items:center;gap:11px;
    padding:9px 10px;border-radius:12px;cursor:pointer;
    transition:background .12s;
  }
  .sug:hover,.sug.active{background:var(--hover,rgba(255,255,255,.1));}
  .sug .sw{
    flex:none;width:30px;height:30px;border-radius:9px;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);
    background-size:cover;
  }
  .sug .meta{flex:1;min-width:0;}
  .sug .jp{
    font-size:14px;font-weight:600;letter-spacing:.03em;
    color:var(--fg,#fff);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .sug .jp em{font-style:normal;font-weight:400;font-size:11px;opacity:.6;margin-left:6px;}
  .sug .en{
    font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--fg-dim,rgba(255,255,255,.55));
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .sug .hx{
    flex:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:10.5px;letter-spacing:.04em;color:var(--fg-dim,rgba(255,255,255,.5));
  }
  .sug-empty{padding:14px;text-align:center;font-size:12px;color:var(--fg-dim,rgba(255,255,255,.5));}

  /* ---------- コントロール ---------- */
  .controls{
    width:min(560px,100%);margin-top:10px;pointer-events:auto;
  }
  .ctl-toggle{
    display:inline-flex;align-items:center;gap:7px;
    height:34px;padding:0 14px;border-radius:999px;
    border:1px solid var(--line,rgba(255,255,255,.2));
    background:var(--surface,rgba(18,16,14,.5));
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    color:var(--fg,#fff);font-size:11.5px;letter-spacing:.06em;
    cursor:pointer;transition:background .2s,transform .15s;
  }
  .ctl-toggle:hover{background:var(--hover,rgba(255,255,255,.12));}
  .ctl-toggle:active{transform:scale(.97);}
  .ctl-toggle svg{transition:transform .3s var(--ease);}
  .ctl-toggle.open svg.chev{transform:rotate(180deg);}

  .panel{
    margin-top:10px;
    border-radius:var(--radius);
    border:1px solid var(--line,rgba(255,255,255,.18));
    background:var(--surface,rgba(18,16,14,.55));
    backdrop-filter:blur(20px) saturate(140%);
    -webkit-backdrop-filter:blur(20px) saturate(140%);
    box-shadow:0 14px 40px var(--shadow,rgba(0,0,0,.3));
    padding:16px 18px 15px;
    overflow:hidden;
    max-height:480px;
    transition:max-height .34s var(--ease),opacity .22s,padding .34s var(--ease),margin .34s var(--ease),border-width .3s;
  }
  .panel.collapsed{max-height:0;opacity:0;padding-top:0;padding-bottom:0;margin-top:0;border-width:0;}

  .slider-row{display:flex;align-items:center;gap:12px;margin-bottom:11px;}
  .slider-row:last-of-type{margin-bottom:0;}
  .slider-row .ch{
    flex:none;width:14px;font-size:11px;font-weight:700;letter-spacing:.04em;
    color:var(--fg-dim,rgba(255,255,255,.65));
  }
  .slider-row input[type=range]{
    flex:1;-webkit-appearance:none;appearance:none;
    height:8px;border-radius:999px;outline:none;cursor:pointer;
    border:1px solid rgba(255,255,255,.16);
  }
  .slider-row input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:17px;height:17px;border-radius:50%;
    background:#fff;border:none;
    box-shadow:0 1px 6px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.12);
    transition:transform .12s;
  }
  .slider-row input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.18);}
  .slider-row input[type=range]::-moz-range-thumb{
    width:17px;height:17px;border-radius:50%;background:#fff;border:none;
    box-shadow:0 1px 6px rgba(0,0,0,.45);
  }
  .slider-row .num{
    flex:none;width:34px;text-align:right;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11.5px;font-variant-numeric:tabular-nums;
    color:var(--fg,rgba(255,255,255,.92));
  }

  .panel-foot{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:14px;padding-top:12px;
    border-top:1px solid var(--line-soft,rgba(255,255,255,.1));
  }
  .mini-btn{
    display:inline-flex;align-items:center;gap:6px;
    height:30px;padding:0 12px;border-radius:999px;
    border:1px solid var(--line,rgba(255,255,255,.2));
    background:transparent;color:var(--fg,#fff);
    font-size:11px;letter-spacing:.05em;cursor:pointer;
    transition:background .18s,transform .15s;
  }
  .mini-btn:hover{background:var(--hover,rgba(255,255,255,.12));}
  .mini-btn:active{transform:scale(.96);}
  .hist{display:flex;gap:5px;align-items:center;}
  .hist i{
    display:block;width:15px;height:15px;border-radius:50%;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.16),0 1px 3px rgba(0,0,0,.18);
    cursor:pointer;transition:transform .14s;
  }
  .hist i:hover{transform:scale(1.25);}

  /* ---------- 下部：情報 ---------- */
  .info{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    padding:0 clamp(18px,5vw,64px) clamp(20px,4vh,40px);
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    gap:clamp(18px,4vw,56px);
    align-items:end;
    pointer-events:none;
  }
  .info > *{pointer-events:auto;}

  .names{min-width:0;}
  .eyebrow{
    display:flex;align-items:center;gap:9px;
    font-size:10px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--fg-dim,rgba(255,255,255,.55));
    margin-bottom:9px;
  }
  .eyebrow .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7;}
  .eyebrow .badge{
    display:inline-flex;align-items:center;
    padding:2px 8px;border-radius:999px;
    letter-spacing:.12em;font-size:9.5px;
    border:1px solid currentColor;opacity:.85;
  }
  h1#jpName{
    font-weight:600;
    font-size:clamp(38px,7.2vw,84px);
    line-height:1.04;
    letter-spacing:.04em;
    text-shadow:0 2px 30px rgba(0,0,0,.12);
    word-break:break-word;
  }
  #yomi{
    margin-top:6px;
    font-size:clamp(12px,1.5vw,15px);
    letter-spacing:.3em;
    color:var(--fg-dim,rgba(255,255,255,.6));
  }
  .en-line{
    margin-top:14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;
  }
  .en-line .label{
    font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--fg-dim,rgba(255,255,255,.5));
  }
  #enName{
    font-size:clamp(15px,2vw,21px);
    letter-spacing:.13em;text-transform:uppercase;
    font-weight:500;
  }
  .de{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:10.5px;letter-spacing:.06em;
    color:var(--fg-dim,rgba(255,255,255,.55));
  }

  .message{
    margin-top:clamp(14px,2.6vh,26px);
    max-width:46ch;
    font-size:clamp(13px,1.55vw,16.5px);
    line-height:1.95;
    letter-spacing:.06em;
    color:var(--fg-mid,rgba(255,255,255,.86));
    border-left:2px solid var(--fg-dim,rgba(255,255,255,.35));
    padding-left:14px;
  }
  .message .src{
    display:block;margin-top:8px;
    font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--fg-dim,rgba(255,255,255,.45));
    font-family:inherit;
  }

  .codes{
    display:flex;flex-direction:column;gap:9px;align-items:flex-end;
    text-align:right;
  }
  .code{
    display:flex;align-items:baseline;gap:9px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .code .k{
    font-size:9px;letter-spacing:.2em;
    color:var(--fg-dim,rgba(255,255,255,.45));
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  }
  .code .v{
    font-size:13px;letter-spacing:.05em;
    font-variant-numeric:tabular-nums;
  }
  .copy{
    cursor:pointer;border:none;background:transparent;
    color:inherit;font:inherit;padding:0;
    border-bottom:1px dashed transparent;transition:border-color .2s;
  }
  .copy:hover{border-bottom-color:currentColor;}
  .alts{
    margin-top:4px;
    display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;
    max-width:280px;
  }
  .alt{
    display:inline-flex;align-items:center;gap:5px;
    padding:3px 9px;border-radius:999px;
    border:1px solid var(--line,rgba(255,255,255,.18));
    font-size:10px;letter-spacing:.04em;cursor:pointer;
    color:var(--fg-mid,rgba(255,255,255,.8));
    background:var(--surface,rgba(0,0,0,.18));
    backdrop-filter:blur(8px);
    transition:background .18s,transform .15s;
  }
  .alt:hover{background:var(--hover,rgba(255,255,255,.14));transform:translateY(-1px);}
  .alt i{width:8px;height:8px;border-radius:50%;display:block;}

  /* トースト */
  .toast{
    position:fixed;left:50%;bottom:max(22px,4vh);transform:translate(-50%,16px);
    background:rgba(20,18,16,.92);color:#fff;
    padding:9px 18px;border-radius:999px;
    font-size:11.5px;letter-spacing:.1em;
    opacity:0;pointer-events:none;z-index:200;
    transition:opacity .24s,transform .28s var(--ease);
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  @media (max-width:760px){
    .info{
      grid-template-columns:1fr;
      gap:16px;
      padding:0 20px 22px;
      align-items:start;
    }
    .codes{align-items:flex-start;text-align:left;flex-direction:row;flex-wrap:wrap;gap:8px 16px;}
    .alts{justify-content:flex-start;max-width:none;}
    .message{max-width:100%;margin-top:14px;font-size:13px;line-height:1.9;}
    .top{padding-top:12px;}
    .hint-key{display:none;}
    h1#jpName{font-size:clamp(34px,11vw,54px);}
  }
  @media (max-height:620px){
    .message{display:none;}
  }
</style>
</head>
<body>
<style>
  /* ---- 追加スタイル：ヒューバー ---- */
  .hue-wrap{
    margin-top:14px;padding-top:13px;
    border-top:1px solid var(--line-soft,rgba(255,255,255,.1));
  }
  .hue-cap{
    display:flex;justify-content:space-between;align-items:center;
    font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--fg-dim,rgba(255,255,255,.5));
    margin-bottom:8px;
  }
  .hue-cap b{font-weight:600;letter-spacing:.1em;font-size:10px;color:var(--fg-mid,rgba(255,255,255,.8));text-transform:none;}
  #hueStrip{
    position:relative;height:16px;border-radius:999px;cursor:crosshair;
    background:linear-gradient(to right,
      #ff0000 0%, #ffff00 16.66%, #00ff00 33.33%, #00ffff 50%,
      #0000ff 66.66%, #ff00ff 83.33%, #ff0000 100%);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.18),0 2px 10px rgba(0,0,0,.18);
    touch-action:none;
  }
  #hueKnob{
    position:absolute;top:50%;width:16px;height:16px;border-radius:50%;
    transform:translate(-50%,-50%);
    background:transparent;border:2px solid #fff;
    box-shadow:0 0 0 1px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.3);
    pointer-events:none;
  }
  .sat-val{
    display:flex;gap:10px;margin-top:12px;
  }
  .sv{
    flex:1;position:relative;height:14px;border-radius:999px;cursor:pointer;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.16);
    touch-action:none;
  }
  .sv span{
    position:absolute;top:50%;width:12px;height:12px;border-radius:50%;
    transform:translate(-50%,-50%);
    background:transparent;border:2px solid #fff;
    box-shadow:0 0 0 1px rgba(0,0,0,.35);pointer-events:none;
  }
  .sv-label{
    flex:none;width:34px;font-size:9.5px;letter-spacing:.16em;
    color:var(--fg-dim,rgba(255,255,255,.5));
    display:flex;align-items:center;
  }
  .panel-foot .right{display:flex;gap:7px;}
</style>

<div class="top">
  <div class="search-wrap">
    <div class="search-bar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
      </svg>
      <input id="q" type="text" placeholder="色名で検索　桜色 / あかねいろ / Cherry Blossom / #B7282E" autocomplete="off" spellcheck="false" autocapitalize="off">
      <span class="hint-key">/</span>
    </div>
    <div class="suggest" id="suggest"></div>
  </div>

  <div class="controls">
    <button class="ctl-toggle open" id="ctlToggle" aria-expanded="true">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 8h16M4 16h16"></path><circle cx="9" cy="8" r="2.4" fill="currentColor" stroke="none"></circle><circle cx="15" cy="16" r="2.4" fill="currentColor" stroke="none"></circle>
      </svg>
      <span>カラーバーで調整</span>
      <svg class="chev" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg>
    </button>

    <div class="panel" id="panel">
      <div class="slider-row">
        <span class="ch" style="color:#ff7b72">R</span>
        <input type="range" id="sR" min="0" max="255" value="30">
        <span class="num" id="vR">30</span>
      </div>
      <div class="slider-row">
        <span class="ch" style="color:#7ee787">G</span>
        <input type="range" id="sG" min="0" max="255" value="80">
        <span class="num" id="vG">80</span>
      </div>
      <div class="slider-row">
        <span class="ch" style="color:#79c0ff">B</span>
        <input type="range" id="sB" min="0" max="255" value="162">
        <span class="num" id="vB">162</span>
      </div>

      <div class="hue-wrap">
        <div class="hue-cap"><span>Hue / 色相</span><b id="hueVal">217°</b></div>
        <div id="hueStrip"><div id="hueKnob"></div></div>
        <div class="sat-val">
          <div class="sv-label">彩度</div>
          <div class="sv" id="satBar"><span id="satKnob"></span></div>
        </div>
        <div class="sat-val">
          <div class="sv-label">明度</div>
          <div class="sv" id="litBar"><span id="litKnob"></span></div>
        </div>
      </div>

      <div class="panel-foot">
        <div class="hist" id="hist"></div>
        <div class="right">
          <button class="mini-btn" id="randomBtn">ランダム</button>
          <button class="mini-btn" id="copyBtn">HEXをコピー</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="info">
  <div class="names">
    <div class="eyebrow">
      <span class="dot"></span>
      <span id="matchState">日本の伝統色 · 一致</span>
      <span class="badge" id="badge">伝統色</span>
    </div>
    <h1 id="jpName" class="serif">瑠璃色</h1>
    <div id="yomi" class="serif">るりいろ</div>
    <div class="en-line">
      <span class="label">English</span>
      <span id="enName">Lapis Lazuli</span>
      <span class="de" id="deInfo"></span>
    </div>
    <div class="message" id="message">
      <span id="msgText"></span>
      <span class="src" id="msgSrc"></span>
    </div>
  </div>

  <div class="codes">
    <div class="code"><span class="k">HEX</span><button class="copy" id="hexBtn"><span class="v" id="hexV">#6495ED</span></button></div>
    <div class="code"><span class="k">RGB</span><span class="v" id="rgbV">30 80 162</span></div>
    <div class="code"><span class="k">HSL</span><span class="v" id="hslV">217° 69% 38%</span></div>
    <div class="alts" id="alts"></div>
  </div>
</div>

window.__MSG__={"桜色":"花びらが散ったあとの地面まで、まだ少し明るい。春のいちばんやわらかい時間。","茜色":"夕日が沈む直前、空がわずかに痛いくらい濃くなる。古い着物の裏地に残る色。","朱色":"鳥居、朱印、提灯。日本人は祈りの場にこの色を選んできた。","山吹色":"花が咲いたあとに実ると、少しほろ苦い。派手なのに、どこか懐かしい。","萌黄":"芽が出て、まだ名前のない若い葉。風が渡るたびに光が揺れる。","常磐色":"「常磐」は変わらないこと。岩の上に根を張った、年を越す緑。","浅葱色":"薄い葱の葉のような青。新選組の羽織の色という記憶も、ここに重なる。","瑠璃色":"ラピスラズリを砕いて得た青。かつて金と同じ重さで取引された色。","藍色":"藍染めは、染めるほどに深くなる。時間を重ねることでしか届かない色。","紺色":"夜の海と、制服と、夜明け前の空。引き締めるための青。","藤色":"藤の房が風に揺れる、春の終わり。手を伸ばすと届きそうで届かない紫。","紫苑色":"秋に野を染める、少し寂しい紫。名前を呼ばれても振り返らない花。","月白":"月の光を受けた白は、白ではなく、うっすら青い。夜の色見本。","銀鼠":"光を受けて、灰色は銀になる。何色でもないことが、いちばん難しい。","墨色":"墨は五色に分かれるという。一滴の濃淡で、紙の上に世界が生まれる。","白":"すべての光を返す色。余白。何も足さないことで、すべてを見せる。","黒":"すべてを吸い込んで、静かに返す色。夜の底、書の始まり。","紅梅色":"梅はまだ寒いうちに咲く。だからこの赤は、少しだけ強い。","東雲色":"夜が明ける直前、空の縁だけが染まる。一日でいちばん短い色。","琥珀色":"木の樹脂が、幾万年かけて光をためた色。中に何かが閉じ込められている。","若竹色":"竹の若い青。まっすぐ伸びるものだけが持つ、落ち着いた緑。","芥子色":"からしの花の黄色。古い商家の壁に、いちばん似合う色。","砥粉色":"白に、ほんの少しの黄と赤。古い紙が時間でまとう色。","藍鉄色":"藍に鉄を重ねると、鈍い光を持つ濃い青になる。錆びた金属の夜。","蘇芳色":"蘇芳の木から取る、深い赤紫。平安の女性たちが袖に隠した色。","今様色":"「今風」という名の紅。平安の流行色だった、明るく軽い赤紫。","空色":"見上げるたびに違う青。空は一日中、同じ色でいてくれない。","海松色":"松の海。暗い緑の中に、茶と黒が混ざって、深さになる。","鶯色":"鶯の羽根の色。声はあんなに澄んでいるのに、色は地味でいい。","小豆色":"煮た小豆の、渋くて温かい赤茶。冬の台所の記憶。","利休色":"利休ねずみ。派手なものをすべて削ぎ落とした先に残る、緑がかった灰。","瓶覗":"壺の口から覗いた程度に染まる、ごく淡い藍。染めの途中の色。","白群":"群青を白で薄めた青。絵の具の名として、いちばん澄んだ青。","群青":"ウルトラマリン。この青のために、かつて山が削られた。","紅色":"紅花から、ごくわずかしか取れない赤。だから高価で、だから特別だった。","桃色":"実りの色であり、花の色でもある。甘さと艶の境目。","杏色":"果実の皮の、産毛のようなオレンジ。触れると柔らかい。","蜜柑色":"冬のこたつの記憶。皮を剥いた瞬間の、部屋に広がる明るさ。","鬱金色":"うこんの根の黄色。かつては黄金（こがね）と呼ばれた、力のある黄。","深緑":"森の底。木々が言葉を飲み込む場所。","苔色":"雨のあとの石。動かないものが、ゆっくり生きている色。","錆色":"鉄が時間と空気に出会った結果。壊れることも、色になる。","黒橡":"橡の実で染めた黒。ただの黒より、少し温かくて、少し重い。","淡紅藤":"藤の色を、朝の光で薄めたような。まだ誰も起きていない時間の色。","菫色":"道ばたに咲く小さな紫。見落とされるために、強く色づいている。","桔梗色":"星のかたちの花。五つの角を持つ、冷たく整った紫。","勿忘草色":"忘れないで、という名前の花。青は記憶の色でもある。","千歳緑":"千年の緑。木の齢を数える代わりに、色の名に預けた。","朱鷺色":"トキの羽根。空を飛ぶときだけ見える、淡い珊瑚色。","金赤":"赤に、金の温度を足した色。祝いの場のいちばん前の列。"};

    h = h.replace('#', '');
    return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
  }
  function rgbToHex(r, g, b) {
    return '#' + [r, g, b].map(function (x) {
      var s = Math.round(x).toString(16);
      return s.length === 1 ? '0' + s : s;
    }).join('').toUpperCase();
  }
  function srgb2lin(c) {
    c /= 255;
    return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  }
  function rgbToLab(r, g, b) {
    var R = srgb2lin(r), G = srgb2lin(g), B = srgb2lin(b);
    var X = (R * 0.4124564 + G * 0.3575761 + B * 0.1804375) / 0.95047;
    var Y = (R * 0.2126729 + G * 0.7151522 + B * 0.0721750) / 1.00000;
    var Z = (R * 0.0193339 + G * 0.1191920 + B * 0.9503041) / 1.08883;
    function f(t) { return t > 0.008856451679 ? Math.cbrt(t) : (7.787037 * t + 16 / 116); }
    var fx = f(X), fy = f(Y), fz = f(Z);
    return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];

  function deltaE(a, b) {
    var dl = a[0] - b[0], da = a[1] - b[1], db = a[2] - b[2];

  }
  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b);
    var h = 0, s = 0, l = (max + min) / 2;
    var d = max - min;
    if (d !== 0) {
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === r) h = ((g - b) / d + (g < b ? 6 : 0));
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;

    }
    return [h, s * 100, l * 100];
  }
  function hslToRgb(h, s, l) {
    h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
    var c = (1 - Math.abs(2 * l - 1)) * s;
    var x = c * (1 - Math.abs((h / 60) % 2 - 1));
    var m = l - c / 2;
    var r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; }
    else if (h < 120) { r = x; g = c; }
    else if (h < 180) { g = c; b = x; }
    else if (h < 240) { g = x; b = c; }
    else if (h < 300) { r = x; b = c; }
    else { r = c; b = x; }
    return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];

  function luminance(r, g, b) {

  }

  /* ---------- build index ---------- */
  function build(list, isJp) {
    return list.map(function (row) {
      var rgb = hexToRgb(row[2]);
      return {
        name: row[0],
        yomi: isJp ? row[1] : '',
        en: isJp ? '' : row[0],
        hex: row[2].toUpperCase(),
        rgb: rgb,
        lab: rgbToLab(rgb[0], rgb[1], rgb[2])

    });
  }
  var JP = build(JP_RAW, true);
  var EN = build(EN_RAW, false);

  /* ---------- ことば ---------- */
  var CURATED = window.__MSG__ || {};

  var POEMS = {
    red: {

    yellow: {

    teal: {

    }
  };

  var SAT_LINE = {
    high: 'はっきりとした輪郭で、まっすぐ目に入ってくる。',
    mid: '主張しすぎない、ちょうどいい声の大きさ。',
    low: '色を削いだ先に残る、骨格のような静けさ。'
  };

  function hueFamily(h, s, l) {
    if (s < 10 || l < 7 || l > 97) return 'neutral';
    if (h < 15 || h >= 345) return 'red';
    if (h < 40) return 'orange';
    if (h < 65) return 'yellow';
    if (h < 90) return 'yellowgreen';
    if (h < 155) return 'green';
    if (h < 180) return 'teal';
    if (h < 200) return 'cyan';
    if (h < 255) return 'blue';
    if (h < 290) return 'violet';
    return 'magenta';
  }
  function toneOf(l) {
    if (l > 78) return 'light';
    if (l < 32) return 'dark';
    return 'mid';
  }
  function buildMessage(rgb) {
    var hsl = rgbToHsl(rgb[0], rgb[1], rgb[2]);

    var tone = toneOf(hsl[2]);
    var poem = (POEMS[fam] || POEMS.neutral)[tone];

    return { text: poem + '　' + SAT_LINE[sat], curated: false };
  }

  /* ---------- state ---------- */
  var state = { r: 30, g: 80, b: 162 };
  var history = [];
  var MAX_HIST = 7;

  var $ = function (id) { return document.getElementById(id); };
  var el = {
    body: document.body,
    q: $('q'), suggest: $('suggest'),
    sR: $('sR'), sG: $('sG'), sB: $('sB'),
    vR: $('vR'), vG: $('vG'), vB: $('vB'),
    hueStrip: $('hueStrip'), hueKnob: $('hueKnob'), hueVal: $('hueVal'),
    satBar: $('satBar'), satKnob: $('satKnob'),
    litBar: $('litBar'), litKnob: $('litKnob'),

    matchState: $('matchState'), badge: $('badge'),

  /* ---------- nearest ---------- */
  function nearest(list, lab) {
    var best = null, bestD = Infinity, second = null, secondD = Infinity;
    for (var i = 0; i < list.length; i++) {
      var d = deltaE(lab, list[i].lab);
      if (d < bestD) { second = best; secondD = bestD; best = list[i]; bestD = d; }
      else if (d < secondD) { second = list[i]; secondD = d; }
    }
    return { best: best, d: bestD, second: second, secondD: secondD };
  }

  /* ---------- theme ---------- */
  function applyTheme(rgb) {
    var hex = rgbToHex(rgb[0], rgb[1], rgb[2]);
    document.documentElement.style.setProperty('--bg', hex);
    el.body.style.backgroundColor = hex;
    el.body.style.backgroundImage = 'none';

    var L = luminance(rgb[0], rgb[1], rgb[2]);
    var dark = L < 0.42;
    var st = document.documentElement.style;
    if (dark) {
      st.setProperty('--fg', '#ffffff');
      st.setProperty('--fg-mid', 'rgba(255,255,255,.88)');
      st.setProperty('--fg-dim', 'rgba(255,255,255,.58)');
      st.setProperty('--surface', 'rgba(16,14,12,.52)');
      st.setProperty('--surface-strong', 'rgba(16,14,12,.84)');
      st.setProperty('--line', 'rgba(255,255,255,.22)');
      st.setProperty('--line-soft', 'rgba(255,255,255,.12)');
      st.setProperty('--hover', 'rgba(255,255,255,.13)');
      st.setProperty('--shadow', 'rgba(0,0,0,.34)');
      st.setProperty('--scrim', 'rgba(0,0,0,.30)');
    } else {
      st.setProperty('--fg', '#17130f');
      st.setProperty('--fg-mid', 'rgba(23,19,15,.86)');
      st.setProperty('--fg-dim', 'rgba(23,19,15,.55)');
      st.setProperty('--surface', 'rgba(255,255,255,.55)');
      st.setProperty('--surface-strong', 'rgba(255,255,255,.90)');
      st.setProperty('--line', 'rgba(20,16,12,.18)');
      st.setProperty('--line-soft', 'rgba(20,16,12,.10)');
      st.setProperty('--hover', 'rgba(20,16,12,.09)');
      st.setProperty('--shadow', 'rgba(60,45,30,.20)');
      st.setProperty('--scrim', 'rgba(255,255,255,.34)');
    }
  }

  /* ---------- sliders ---------- */
  function paintSliders(rgb) {
    var r = rgb[0], g = rgb[1], b = rgb[2];
    el.sR.style.background = 'linear-gradient(to right, rgb(0,' + g + ',' + b + '), rgb(255,' + g + ',' + b + '))';
    el.sG.style.background = 'linear-gradient(to right, rgb(' + r + ',0,' + b + '), rgb(' + r + ',255,' + b + '))';
    el.sB.style.background = 'linear-gradient(to right, rgb(' + r + ',' + g + ',0), rgb(' + r + ',' + g + ',255))';
  }
  function paintBars(hsl) {
    var h = hsl[0], s = hsl[1], l = hsl[2];
    el.hueVal.textContent = Math.round(h) + '°';
    el.hueKnob.style.left = (h / 360 * 100) + '%';
    el.satKnob.style.left = s + '%';
    el.litKnob.style.left = l + '%';

  }

  /* ---------- render ---------- */
  var currentSuggestions = [];
  var sugIndex = -1;

  function render(rgb, opts) {
    opts = opts || {};
    var r = Math.round(rgb[0]), g = Math.round(rgb[1]), b = Math.round(rgb[2]);
    state = { r: r, g: g, b: b };

    var hex = rgbToHex(r, g, b);
    var hsl = rgbToHsl(r, g, b);
    var lab = rgbToLab(r, g, b);

    applyTheme([r, g, b]);

    /* names */
    var jp = nearest(JP, lab);
    var en = nearest(EN, lab);

    el.jpName.textContent = jp.best.name;
    el.yomi.textContent = jp.best.yomi;
    el.enName.textContent = en.best.name;

    var exactJp = jp.best.hex === hex;
    var label;
    if (exactJp) label = 'この色そのもの';
    else if (jp.d < 1.6) label = 'ほぼ一致 ΔE ' + jp.d.toFixed(1);
    else label = 'もっとも近い色 ΔE ' + jp.d.toFixed(1);
    el.matchState.textContent = label;
    el.badge.textContent = exactJp ? '伝統色名' : '近似';
    el.badge.style.opacity = exactJp ? '1' : '.6';

    el.deInfo.textContent = (en.best.hex === hex)
      ? '= ' + en.best.hex
      : 'ΔE ' + en.d.toFixed(1) + ' · ' + en.best.hex;

    /* codes */
    el.hexV.textContent = hex;
    el.rgbV.textContent = r + ' ' + g + ' ' + b;
    el.hslV.textContent = Math.round(hsl[0]) + '° ' + Math.round(hsl[1]) + '% ' + Math.round(hsl[2]) + '%';

    /* message */
    var msg;
    if (exactJp && CURATED[jp.best.name]) {
      msg = { text: CURATED[jp.best.name], curated: true };
    } else if (jp.d < 6 && CURATED[jp.best.name]) {
      msg = { text: CURATED[jp.best.name], curated: true };
    } else {
      msg = buildMessage([r, g, b]);
    }
    el.msgText.textContent = msg.text;
    el.msgSrc.textContent = msg.curated
      ? 'ことば — ' + jp.best.name
      : 'この色からの印象';

    /* alternatives */
    el.alts.innerHTML = '';
    var cand = [];
    for (var i = 0; i < JP.length; i++) {
      if (JP[i].hex === jp.best.hex) continue;
      cand.push({ c: JP[i], d: deltaE(lab, JP[i].lab) });
    }
    cand.sort(function (a, b2) { return a.d - b2.d; });
    cand.slice(0, 3).forEach(function (o) {
      var chip = document.createElement('button');
      chip.className = 'alt';
      chip.innerHTML = '<i style="background:' + o.c.hex + '"></i>' + o.c.name;
      chip.title = o.c.name + '（' + o.c.yomi + '） ' + o.c.hex;
      chip.addEventListener('click', function () { commit(hexToRgb(o.c.hex), true); });
      el.alts.appendChild(chip);
    });

    /* sliders & bars */
    el.sR.value = r; el.sG.value = g; el.sB.value = b;
    el.vR.textContent = r; el.vG.textContent = g; el.vB.textContent = b;
    paintSliders([r, g, b]);
    paintBars(hsl);

    if (!opts.silent) addHistory(hex);
  }

  function addHistory(hex) {
    var idx = history.indexOf(hex);
    if (idx === 0) return;
    if (idx > 0) history.splice(idx, 1);
    history.unshift(hex);
    if (history.length > MAX_HIST) history.pop();
    renderHistory();
  }
  function renderHistory() {
    el.hist.innerHTML = '';
    history.forEach(function (h) {
      var i = document.createElement('i');
      i.style.background = h;
      i.title = h;
      i.addEventListener('click', function () { commit(hexToRgb(h), true); });
      el.hist.appendChild(i);
    });
  }

  function commit(rgb, fromPick) {
    render(rgb);
    el.suggest.classList.remove('open');
    if (fromPick) el.q.blur();
  }

  /* ---------- suggestions ---------- */
  function kata2hira(s) {
    return s.replace(/[\u30a1-\u30f6]/g, function (ch) {
      return String.fromCharCode(ch.charCodeAt(0) - 0x60);
    });
  }
  function normalize(s) { return kata2hira(String(s).toLowerCase().trim()); }

  function search(q) {
    q = normalize(q);
    if (!q) return [];
    var out = [];
    var hexQ = q.replace(/^#/, '');
    var looksHex = /^[0-9a-f]{2,6}$/.test(hexQ);

    for (var i = 0; i < JP.length; i++) {
      var c = JP[i];
      var n = normalize(c.name), y = normalize(c.yomi);
      var score = -1;
      if (n === q || y === q) score = 100;
      else if (n.indexOf(q) === 0 || y.indexOf(q) === 0) score = 80;
      else if (n.indexOf(q) > -1 || y.indexOf(q) > -1) score = 60;
      if (looksHex && c.hex.toLowerCase().indexOf('#' + hexQ) === 0) score = Math.max(score, 90);
      if (score > 0) out.push({ c: c, s: score, kind: 'jp' });
    }
    for (var j = 0; j < EN.length; j++) {
      var e = EN[j];
      var en = normalize(e.name);
      var sc = -1;
      if (en === q) sc = 100;
      else if (en.indexOf(q) === 0) sc = 78;
      else if (en.split(/\s|(?=[A-Z])/).some(function (w) { return w && normalize(w).indexOf(q) === 0; })) sc = 70;
      else if (en.indexOf(q) > -1) sc = 55;
      if (looksHex && e.hex.toLowerCase().indexOf('#' + hexQ) === 0) sc = Math.max(sc, 90);
      if (sc > 0) out.push({ c: e, s: sc - 2, kind: 'en' });
    }
    out.sort(function (a, b) { return b.s - a.s; });
    return out.slice(0, 9);
  }

  function openSuggest(items) {
    currentSuggestions = items;
    sugIndex = -1;
    if (!items.length) {
      el.suggest.innerHTML = '<div class="sug-empty">該当する色名が見つかりません（HEX / 漢字 / かな / 英語で入力）</div>';
      el.suggest.classList.add('open');
      return;
    }
    el.suggest.innerHTML = '';
    items.forEach(function (it, idx) {
      var row = document.createElement('div');
      row.className = 'sug';
      row.setAttribute('data-idx', idx);
      var sub = it.kind === 'jp'
        ? '<em>' + it.c.yomi + '</em>'
        : '<em>CSS</em>';
      var enTxt = it.kind === 'jp' ? '' : '';
      row.innerHTML =
        '<span class="sw" style="background:' + it.c.hex + '"></span>' +
        '<span class="meta">' +
          '<span class="jp">' + it.c.name + sub + '</span>' +
          '<span class="en">' + (it.kind === 'jp' ? 'TRADITIONAL JAPANESE' : 'CSS NAMED COLOR') + enTxt + '</span>' +
        '</span>' +
        '<span class="hx">' + it.c.hex + '</span>';
      row.addEventListener('mousedown', function (ev) {
        ev.preventDefault();
        commit(hexToRgb(it.c.hex), true);
      });
      el.suggest.appendChild(row);
    });
    el.suggest.classList.add('open');
  }

  /* ---------- events ---------- */
  el.q.addEventListener('input', function () {
    var v = el.q.value.trim();
    if (!v) { el.suggest.classList.remove('open'); return; }
    openSuggest(search(v));
  });
  el.q.addEventListener('keydown', function (ev) {
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      if (!currentSuggestions.length) return;
      ev.preventDefault();
      sugIndex += (ev.key === 'ArrowDown' ? 1 : -1);
      if (sugIndex < 0) sugIndex = currentSuggestions.length - 1;
      if (sugIndex >= currentSuggestions.length) sugIndex = 0;
      Array.prototype.forEach.call(el.suggest.children, function (c, i) {
        if (c.classList) c.classList.toggle('active', i === sugIndex);
      });
    } else if (ev.key === 'Enter') {
      var v = el.q.value.trim();
      if (sugIndex >= 0 && currentSuggestions[sugIndex]) {
        commit(hexToRgb(currentSuggestions[sugIndex].c.hex), true);
      } else if (/^#?[0-9a-fA-F]{6}$/.test(v)) {
        commit(hexToRgb(v), true);
      } else if (currentSuggestions.length) {
        commit(hexToRgb(currentSuggestions[0].c.hex), true);
      }
      el.q.value = '';
    } else if (ev.key === 'Escape') {
      el.suggest.classList.remove('open');
      el.q.blur();
    }
  });
  document.addEventListener('click', function (ev) {
    if (!el.suggest.contains(ev.target) && ev.target !== el.q) el.suggest.classList.remove('open');
  });

  el.sR.addEventListener('input', function () { render([+el.sR.value, +el.sG.value, +el.sB.value]); });
  el.sG.addEventListener('input', function () { render([+el.sR.value, +el.sG.value, +el.sB.value]); });
  el.sB.addEventListener('input', function () { render([+el.sR.value, +el.sG.value, +el.sB.value]); });

  /* bars drag */
  function bindBar(node, onMove) {
    var dragging = false;
    function pos(ev) {
      var rect = node.getBoundingClientRect();
      var x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left;
      return Math.max(0, Math.min(1, x / rect.width));
    }
    node.addEventListener('pointerdown', function (ev) {
      dragging = true;
      node.setPointerCapture && node.setPointerCapture(ev.pointerId);
      onMove(pos(ev));
      ev.preventDefault();
    });
    node.addEventListener('pointermove', function (ev) { if (dragging) onMove(pos(ev)); });
    node.addEventListener('pointerup', function () { dragging = false; });
    node.addEventListener('pointercancel', function () { dragging = false; });
  }

    var hsl = rgbToHsl(state.r, state.g, state.b);
    var rgb = hslToRgb(p * 360, Math.max(hsl[1], 6), hsl[2]);
    render(rgb);
  });
  bindBar(el.satBar, function (p) {
    var hsl = rgbToHsl(state.r, state.g, state.b);
    render(hslToRgb(hsl[0], p * 100, hsl[2]));
  });
  bindBar(el.litBar, function (p) {
    var hsl = rgbToHsl(state.r, state.g, state.b);
    render(hslToRgb(hsl[0], hsl[1], p * 100));
  });

  el.ctlToggle.addEventListener('click', function () {
    var open = el.panel.classList.toggle('collapsed');
    el.ctlToggle.classList.toggle('open', !open);
    el.ctlToggle.setAttribute('aria-expanded', String(!open));
  });

  el.randomBtn.addEventListener('click', function () {
    render([Math.floor(Math.random() * 256), Math.floor(Math.random() * 256), Math.floor(Math.random() * 256)]);
  });

  var toastTimer = null;
  function toast(t) {
    el.toast.textContent = t;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.classList.remove('show'); }, 1500);
  }
  function copyHex() {
    var text = el.hexV.textContent;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(text + ' をコピーしました'); },
        function () { toast(text); });
    } else { toast(text); }
  }
  el.copyBtn.addEventListener('click', copyHex);
  el.hexBtn.addEventListener('click', copyHex);

  document.addEventListener('keydown', function (ev) {
    if (ev.key === '/' && document.activeElement !== el.q) {
      ev.preventDefault();
      el.q.focus();
      el.q.select();
    }
  });

  /* ---------- boot ---------- */
  render([30, 80, 162]);
})();

</script>
